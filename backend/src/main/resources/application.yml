server:
  port: 8080

spring:
  application:
    name: termiguard-backend
  datasource:
    url: jdbc:mysql://localhost:3306/termiguard_db?useUnicode=true&characterEncoding=UTF-8&useSSL=false&serverTimezone=Asia/Kuala_Lumpur&allowPublicKeyRetrieval=true
    username: root
    password: 1121
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Kuala_Lumpur
    serialization:
      write-dates-as-timestamps: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.termiguard: DEBUG
    org.springframework.web: INFO

termiguard:
  ml-service:
    url: http://localhost:5000
    connect-timeout-ms: 1200
    read-timeout-ms: 2000
